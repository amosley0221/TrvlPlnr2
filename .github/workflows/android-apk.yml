name: Build Android APK

# Produces a sideloadable Android APK that wraps the deployed PWA in a
# Capacitor WebView, and attaches it to a GitHub Release.
#
# Triggers:
#   - manual: Actions tab → "Build Android APK" → Run workflow.
#     Pick a release tag (will be created if it doesn't exist).
#   - automatic: pushing any tag that starts with "v" (e.g. git tag v0.2.0 &&
#     git push --tags) builds an APK and attaches it to that tag's release.
#
# Signing: by default the APK is signed with the Android debug keystore
# (fine for sideloading; each build has a different signature, so upgrades
# require uninstall-then-install). For a stable identity across releases
# (so updates install over the previous version), set these three repo
# secrets and the workflow switches to release signing automatically:
#   ANDROID_KEYSTORE_BASE64   - base64 of your release .keystore
#   ANDROID_KEYSTORE_PASSWORD - keystore password
#   ANDROID_KEY_ALIAS         - key alias inside the keystore
#   ANDROID_KEY_PASSWORD      - alias's key password (often same as above)
# See android/README.md for how to generate the keystore.

on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: "Deployed PWA base URL the APK will load"
        required: false
        default: "https://trvlplnr.onrender.com"
      release_tag:
        description: "Release tag to attach the APK to (e.g. v0.1.0). Created if it doesn't exist."
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Resolve build inputs
        id: cfg
        run: |
          PWA_URL='${{ inputs.pwa_url }}'
          [ -n "$PWA_URL" ] || PWA_URL='https://trvlplnr.onrender.com'
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG='${{ inputs.release_tag }}'
          fi
          VERSION="${TAG#v}"
          # appVersionCode must be a positive integer; GH run_number is monotonic
          CODE="${{ github.run_number }}"
          HAVE_KEYSTORE=""
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && HAVE_KEYSTORE="1"
          echo "pwa_url=$PWA_URL"            >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE"          >> "$GITHUB_OUTPUT"
          echo "have_keystore=$HAVE_KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "Build $VERSION ($CODE) wrapping $PWA_URL"

      - name: Patch capacitor.config.json with run inputs
        env:
          PWA_URL: ${{ steps.cfg.outputs.pwa_url }}
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            c.server = c.server || {};
            c.server.url = process.env.PWA_URL;
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
            console.log('capacitor.config.json now points at', process.env.PWA_URL);
          "

      - name: Install npm deps
        run: npm ci

      - name: Install Capacitor
        run: npm install --save-dev --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web bundle
        # Vite build. Capacitor packages dist/ as the fallback web assets;
        # at runtime the WebView loads server.url instead (unless offline).
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Stamp version into Android build.gradle
        env:
          VERSION_NAME: ${{ steps.cfg.outputs.version_name }}
          VERSION_CODE: ${{ steps.cfg.outputs.version_code }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'android/app/build.gradle';
            let g = fs.readFileSync(p, 'utf8');
            g = g.replace(/versionCode\s+\d+/,       'versionCode ' + process.env.VERSION_CODE);
            g = g.replace(/versionName\s+\"[^\"]+\"/, 'versionName \"' + process.env.VERSION_NAME + '\"');
            fs.writeFileSync(p, g);
          "

      - name: Configure release signing
        if: steps.cfg.outputs.have_keystore == '1'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "$KEYSTORE_PASSWORD"
                      keyAlias "$KEY_ALIAS"
                      keyPassword "$KEY_PASSWORD"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: Build release APK
        if: steps.cfg.outputs.have_keystore == '1'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build debug APK (fallback — no release keystore configured)
        if: steps.cfg.outputs.have_keystore != '1'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          if [ "${{ steps.cfg.outputs.have_keystore }}" = "1" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
            SUFFIX="release"
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
            SUFFIX="debug"
          fi
          if [ ! -f "$SRC" ]; then
            echo "::error::APK not found at $SRC"
            find android/app/build/outputs -name '*.apk'
            exit 1
          fi
          OUT="trvlplnr-${{ steps.cfg.outputs.version_name }}-${SUFFIX}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.cfg.outputs.release_tag }}
          name: TrvlPlnr ${{ steps.cfg.outputs.release_tag }}
          body: |
            Standalone Android APK built with Capacitor, wrapping the PWA at
            `${{ steps.cfg.outputs.pwa_url }}` in a native WebView.

            **Install:** Download the APK, enable "Install unknown apps" for
            your file manager / browser, open the APK, tap Install.

            **Signing:** ${{ steps.cfg.outputs.have_keystore == '1' && 'release-signed with the configured keystore (upgrades install over previous versions)' || 'debug-signed (sideloadable; each build has a different signature, so an upgrade requires uninstalling the previous version first — set the keystore repo secrets to switch to persistent release signing, see android/README.md)' }}.
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.path }}
